<!doctype html><html><body><h1>My Requests</h1>{% for item_request in requests_made %}<section><h2>{{ item_request.listing.title }}</h2><p>Status: {{ item_request.get_status_display }}</p><p>{{ item_request.message }}</p>{% if item_request.status == "pending" %}<form method="post" action="{% url 'requests_app:cancel_request' item_request.id %}">{% csrf_token %}<button type="submit">Cancel</button></form>{% endif %}</section>{% empty %}<p>You have not requested any items.</p>{% endfor %}</body></html>
