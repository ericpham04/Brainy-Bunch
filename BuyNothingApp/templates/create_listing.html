{% extends "base.html" %}

{% block title %}Share an Item{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h2 class="text-center mb-0">
                    Share an Item
                </h2>

            </div>

            <div class="card-body">

                <p class="text-center text-muted mb-4">

                    Help someone in your community by sharing something you no longer need.

                </p>

                <form>

                    <div class="mb-3">

                        <label class="form-label">
                            Item Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Example: Coffee Table">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Category
                        </label>

                        <select class="form-select">

                            <option>Furniture</option>
                            <option>Electronics</option>
                            <option>Kitchen</option>
                            <option>Clothing</option>
                            <option>Books</option>
                            <option>Toys</option>
                            <option>Other</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Condition
                        </label>

                        <select class="form-select">

                            <option>Like New</option>
                            <option>Good</option>
                            <option>Fair</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            rows="5"
                            placeholder="Describe your item..."></textarea>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">

                            Upload Photo

                        </label>

                        <input
                            class="form-control"
                            type="file">

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Share Item

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
