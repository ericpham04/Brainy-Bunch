<!doctype html><html><body><h1>Inbox</h1>{% for message in received_messages %}<section><p><strong>From:</strong> {{ message.sender.username }}</p>{% if message.listing %}<p><strong>Listing:</strong> {{ message.listing.title }}</p>{% endif %}<p>{{ message.text }}</p>{% if message.listing %}<a href="{% url 'messages_app:conversation_with_listing' message.sender.id message.listing.id %}">Reply</a>{% else %}<a href="{% url 'messages_app:conversation' message.sender.id %}">Reply</a>{% endif %}</section>{% empty %}<p>No messages.</p>{% endfor %}</body></html>
