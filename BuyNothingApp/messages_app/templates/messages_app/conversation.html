<!doctype html><html><body><h1>Conversation with {{ other_user.username }}</h1>{% if listing %}<h2>Listing: {{ listing.title }}</h2>{% endif %}{% for message in conversation_messages %}<p><strong>{{ message.sender.username }}:</strong> {{ message.text }}</p>{% empty %}<p>No messages yet.</p>{% endfor %}<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Send</button></form></body></html>
