{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="text-center">
                    Create an Account
                </h3>

            </div>

            <div class="card-body">

                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="First Name">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Last Name">

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Email">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Password">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            placeholder="Confirm Password">

                    </div>

                    <button class="btn btn-success w-100">

                        Create Account

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
